<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1f24" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="14" fill="url(#shieldGrad)" stroke="#facc15" stroke-width="2.5" />
  
  <!-- Steering Wheel Outer Ring -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" />
  
  <!-- Central Hub -->
  <circle cx="32" cy="32" r="6" fill="#ef4444" stroke="#facc15" stroke-width="2" />
  
  <!-- Spokes -->
  <!-- Left Spoke -->
  <line x1="13" y1="32" x2="26" y2="32" stroke="#facc15" stroke-width="3.5" stroke-linecap="round" />
  <!-- Right Spoke -->
  <line x1="38" y1="32" x2="51" y2="32" stroke="#facc15" stroke-width="3.5" stroke-linecap="round" />
  <!-- Bottom Center Spoke -->
  <line x1="32" y1="38" x2="32" y2="51" stroke="#facc15" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Top Marker -->
  <circle cx="32" cy="11" r="2" fill="#ef4444" />
</svg>
